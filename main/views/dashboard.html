<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Santa Dashboard</title>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.5"></script>
  <!-- Basic styling -->
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      background-color: #f8f9fa;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      padding: 0 20px;
    }
    .panel {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 15px;
      margin-bottom: 20px;
      background-color: #fff;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .btn {
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .btn:hover {
      background-color: #0069d9;
    }
    .btn-sm {
      padding: 4px 8px;
      font-size: 12px;
    }
    .btn-success { background-color: #28a745; }
    .btn-success:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; }
    .btn-danger:hover { background-color: #c82333; }
    .btn-info { background-color: #17a2b8; }
    .btn-info:hover { background-color: #138496; }
    .table {
      width: 100%;
      border-collapse: collapse;
    }
    .table th, .table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-control {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 15px;
      cursor: pointer;
    }
    .tab.active {
      border-bottom: 2px solid #007bff;
      font-weight: bold;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .alert {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .alert-success {
      background-color: #d4edda;
      color: #155724;
    }
    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
    }
    .member-select {
      height: 150px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 4px;
    }
    .member-item {
      padding: 5px;
      margin-bottom: 5px;
      border-bottom: 1px solid #eee;
    }
    .guid-display {
      font-family: monospace;
      font-size: 12px;
      color: #666;
      background-color: #f8f9fa;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid #ddd;
      margin-left: 10px;
    }
    .group-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Secret Santa Dashboard</h1>
  </div>
  
  <!-- Loading Indicator -->
  <div id="loading-indicator" class="loading-indicator" style="display: none;">
    <div class="spinner"></div>
    <span>Processing...</span>
  </div>
  
  <div class="container">
    <div class="tabs">
      <div class="tab active" id="tab-members" onclick="activateTab('members')">Members</div>
      <div class="tab" id="tab-groups" onclick="activateTab('groups')">Groups</div>
      <div class="tab" id="tab-matches" onclick="activateTab('matches')">Matches</div>
    </div>
    
    <!-- Members Section -->
    <div class="tab-content active" id="content-members">
      <div class="panel">
        <div class="panel-header">
          <h2>Members</h2>
          <button class="btn" hx-get="/partials/member-form" hx-target="#member-form-container" hx-swap="innerHTML">Add New Member</button>
        </div>
        
        <div id="member-form-container"></div>
        
        <div id="members-list" hx-get="http://main:3001/members" hx-trigger="load" hx-swap="innerHTML">
          <p>Loading members...</p>
        </div>
      </div>
    </div>
    
    <!-- Groups Section -->
    <div class="tab-content" id="content-groups">
      <div class="panel">
        <div class="panel-header">
          <h2>Groups</h2>
          <button class="btn" hx-get="/partials/group-form" hx-target="#group-form-container" hx-swap="innerHTML">Create New Group</button>
        </div>
        
        <div id="group-form-container"></div>
        
        <!-- Debug Panel -->
        <div class="panel" style="margin-bottom: 15px; background-color: #f8f9fa;">
          <h4>Debug: Test API Endpoints</h4>
          <p>Use this to test if the API is working:</p>
          <button class="btn btn-sm btn-info" 
                  onclick="testAPI()">Test API Connection</button>
          <button class="btn btn-sm btn-warning" 
                  onclick="testProxy()">Test Proxy Connection</button>
          <div id="debug-output" style="margin-top: 10px; font-family: monospace; font-size: 12px;"></div>
        </div>
        
        <div id="groups-list" hx-get="http://main:3000/api/groups" hx-trigger="load" hx-swap="innerHTML">
          <p>Loading groups...</p>
        </div>
      </div>
    </div>
    
    <!-- Matches Section -->
    <div class="tab-content" id="content-matches">
      <div class="panel">
        <div class="panel-header">
          <h2>Secret Santa Matches</h2>
        </div>
        
        <div id="match-panel" hx-get="/partials/match-panel" hx-trigger="load" hx-swap="innerHTML">
          <p>Loading match panel...</p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Simple tab navigation
    function activateTab(tabName) {
      // Hide all content
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      
      // Deactivate all tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Activate selected tab and content
      document.getElementById('content-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }
    
    // Set up event listener for notifications
    document.body.addEventListener('htmx:afterSwap', function(event) {
      // Auto-hide alerts after 5 seconds
      const alerts = document.querySelectorAll('.alert');
      alerts.forEach(alert => {
        setTimeout(() => {
          alert.style.display = 'none';
        }, 5000);
      });
    });
    
    // HTMX debugging
    document.body.addEventListener('htmx:beforeRequest', function(event) {
      console.log('HTMX Request starting:', event.detail);
      console.log('Target:', event.detail.target);
      console.log('Request:', event.detail.requestConfig);
    });
    
    document.body.addEventListener('htmx:afterRequest', function(event) {
      console.log('HTMX Request completed:', event.detail);
      console.log('Status:', event.detail.xhr.status);
      console.log('Response:', event.detail.xhr.responseText);
    });
    
    document.body.addEventListener('htmx:responseError', function(event) {
      console.error('HTMX Response Error:', event.detail);
      console.error('Status:', event.detail.xhr.status);
      console.error('Response:', event.detail.xhr.responseText);
    });
    
    // Function to copy GUID to clipboard
    function copyGuid(guid) {
      navigator.clipboard.writeText(guid).then(() => {
        // Show a brief success message
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Copied!';
        button.style.backgroundColor = '#28a745';
        setTimeout(() => {
          button.textContent = originalText;
          button.style.backgroundColor = '#17a2b8';
        }, 2000);
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
    }
    
    // Debug function to test API
    async function testAPI() {
      const debugOutput = document.getElementById('debug-output');
      debugOutput.innerHTML = 'Testing API connection...';
      
      try {
        // Test the main API endpoint
        const response = await fetch('http://localhost:3001/api/groups');
        const data = await response.json();
        
        debugOutput.innerHTML = `
          <strong>✅ API Connection Successful!</strong><br>
          Status: ${response.status}<br>
          Groups found: ${data.length}<br>
          First group ID: ${data[0]?._id || 'None'}<br>
          <br>
          <strong>Test Generate Matches:</strong><br>
          <button class="btn btn-sm btn-success" 
                  onclick="testGenerateMatches('${data[0]?._id || ''}')"
                  ${!data[0]?._id ? 'disabled' : ''}>
            Test Generate Matches for First Group
          </button>
        `;
      } catch (error) {
        debugOutput.innerHTML = `
          <strong>❌ API Connection Failed!</strong><br>
          Error: ${error.message}<br>
          <br>
          <strong>Possible issues:</strong><br>
          - Main server not running on port 3001<br>
          - Docker containers not started<br>
          - Network configuration issue
        `;
      }
    }
    
    // Test generate matches function
    async function testGenerateMatches(groupId) {
      if (!groupId) {
        alert('No group ID available for testing');
        return;
      }
      
      const debugOutput = document.getElementById('debug-output');
      debugOutput.innerHTML += '<br><br>Testing Generate Matches...';
      
      try {
        const response = await fetch(`http://localhost:3001/api/match/${groupId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          }
        });
        
        const data = await response.json();
        
        debugOutput.innerHTML += `
          <br><strong>✅ Generate Matches Response:</strong><br>
          Status: ${response.status}<br>
          Response: ${JSON.stringify(data, null, 2)}
        `;
      } catch (error) {
        debugOutput.innerHTML += `
          <br><strong>❌ Generate Matches Failed:</strong><br>
          Error: ${error.message}
        `;
      }
    }
    
    // Test proxy connection function
    async function testProxy() {
      const debugOutput = document.getElementById('debug-output');
      debugOutput.innerHTML += '<br><br>Testing Proxy Connection...';
      
      try {
        const response = await fetch('/debug/api-test');
        const data = await response.json();
        
        debugOutput.innerHTML += `
          <br><strong>✅ Proxy Test Response:</strong><br>
          Status: ${response.status}<br>
          Response: ${JSON.stringify(data, null, 2)}
        `;
      } catch (error) {
        debugOutput.innerHTML += `
          <br><strong>❌ Proxy Test Failed:</strong><br>
          Error: ${error.message}
        `;
      }
    }
  </script>
</body>
</html>
