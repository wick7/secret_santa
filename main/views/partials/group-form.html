<div class="panel">
    <h3>{{#if group}}Edit{{else}}Create{{/if}} Group</h3>
    
    {{#if group}}
    <div class="group-id-info" style="margin-bottom: 15px; padding: 10px; background-color: #f8f9fa; border-radius: 4px; border: 1px solid #ddd;">
      <strong>Group ID:</strong>
      <div class="guid-display">
        <code>{{group._id}}</code>
        <button class="btn btn-sm btn-info" 
                onclick="copyGuid('{{group._id}}')" 
                title="Copy Group ID">
          📋 Copy
        </button>
      </div>
    </div>
    {{/if}}
    
    <form hx-{{#if group}}put="/api/proxy/group/{{group._id}}"{{else}}post="/api/proxy/group"{{/if}}
          hx-target="#groups-list"
          hx-swap="innerHTML">
      
      <div class="form-group">
        <label for="name">Group Name</label>
        <input type="text" id="name" name="name" class="form-control" value="{{group.name}}" required>
      </div>
      
      <div class="form-group">
        <label for="year">Year</label>
        <input type="text" id="year" name="year" class="form-control" value="{{#if group}}{{group.year}}{{else}}2025{{/if}}" required>
      </div>
      
      <div class="form-group">
        <label>Select Members</label>
        <div class="member-select">
          {{#each allMembers}}
          <div class="member-item">
            <label>
              <input type="checkbox" name="members[]" value="{{_id}}" 
                    {{#if isSelected}}checked{{/if}}>
              {{firstName}} {{lastName}}
              {{#if _id}}
              <span class="member-id">(ID: {{_id}})</span>
              {{/if}}
            </label>
          </div>
          {{/each}}
        </div>
      </div>
      
      <div class="form-group">
        <button type="submit" class="btn btn-success">Save Group</button>
        <button type="button" class="btn" onclick="document.getElementById('group-form-container').innerHTML = ''">Cancel</button>
      </div>
    </form>
  </div>
  
  <style>
    .guid-display {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }
    .guid-display code {
      font-family: monospace;
      font-size: 12px;
      color: #666;
      background-color: #e9ecef;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid #ddd;
    }
    .member-id {
      font-size: 11px;
      color: #666;
      font-family: monospace;
    }
  </style>
