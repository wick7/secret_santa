<table class="table">
    <thead>
      <tr>
        <th>Group Name</th>
        <th>Year</th>
        <th>Members</th>
        <th>Status</th>
        <th>Group ID</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- This content will be replaced by the API response -->
      {{#each groups}}
      <tr>
        <td>
          <div class="group-info">
            <strong>{{name}}</strong>
          </div>
        </td>
        <td>{{year}}</td>
        <td>{{members.length}} members</td>
        <td>
          <span class="badge {{#if archived}}badge-secondary{{else}}badge-success{{/if}}">
            {{#if archived}}Archived{{else}}Active{{/if}}
          </span>
        </td>
        <td>
          <div class="guid-display">
            <code>{{_id}}</code>
            <button class="btn btn-sm btn-info" 
                    onclick="copyGuid('{{_id}}')" 
                    title="Copy Group ID">
              📋
            </button>
          </div>
        </td>
        <td>
          <div class="group-actions">
            <button class="btn btn-sm" 
                    hx-get="http://main:3000/api/groups/{{_id}}" 
                    hx-target="#group-form-container"
                    hx-swap="innerHTML">Edit</button>
            <button class="btn btn-sm btn-danger" 
                    hx-delete="http://main:3000/api/groups/{{_id}}" 
                    hx-confirm="Are you sure you want to delete this group?"
                    hx-target="#groups-list"
                    hx-swap="innerHTML">Delete</button>
            {{#unless archived}}
            <button class="btn btn-sm btn-success" 
                    hx-post="http://main:3000/api/match/{{_id}}" 
                    hx-target="#match-results"
                    hx-swap="innerHTML"
                    hx-confirm="Generate new matches for this group?">Generate Matches</button>
            <button class="btn btn-sm btn-info" 
                    hx-post="http://main:3000/api/match/email-notification/{{_id}}" 
                    hx-target="#notification-results"
                    hx-swap="innerHTML"
                    hx-confirm="Send email notifications to all Secret Santas?">Email Notify</button>
            <button class="btn btn-sm btn-info" 
                    hx-post="http://main:3000/api/match/notification/{{_id}}" 
                    hx-target="#notification-results"
                    hx-swap="innerHTML"
                    hx-confirm="Send SMS notifications to all Secret Santas?">SMS Notify</button>
            {{/unless}}
          </div>
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  
  <style>
    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-success {
      background-color: #28a745;
      color: white;
    }
    .badge-secondary {
      background-color: #6c757d;
      color: white;
    }
    .guid-display {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .guid-display code {
      font-size: 11px;
      color: #666;
      background-color: #f8f9fa;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #ddd;
    }
  </style>
