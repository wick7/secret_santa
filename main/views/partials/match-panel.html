<div class="panel">
    <h3>Generate Matches</h3>
    
    <div class="form-group">
      <label for="groupSelect">Select Group</label>
      <select id="groupSelect" class="form-control" 
              hx-get="http://main:3000/api/groups/:value" 
              hx-target="#selected-group-info"
              hx-swap="innerHTML"
              hx-trigger="change">
        <option value="">-- Select a Group --</option>
        {{#each groups}}
        <option value="{{_id}}">{{name}} ({{year}})</option>
        {{/each}}
      </select>
    </div>
    
    <div id="selected-group-info"></div>
    
    <div class="panel" id="match-actions" style="display: none;">
      <div class="form-group">
        <div class="group-guid-info" style="margin-bottom: 15px;">
          <strong>Selected Group ID:</strong>
          <div class="guid-display">
            <code id="current-group-id"></code>
            <button class="btn btn-sm btn-info" 
                    onclick="copyGuid(document.getElementById('current-group-id').textContent)" 
                    title="Copy Group ID">
              📋 Copy
            </button>
          </div>
        </div>
        
        <div class="action-buttons">
          <button class="btn btn-success" 
                  hx-post="http://main:3000/api/match/generate/:groupId" 
                  hx-target="#match-results"
                  hx-swap="innerHTML">
            Generate New Matches
          </button>
          
          <button class="btn" 
                  hx-get="http://main:3000/api/match/:groupId" 
                  hx-target="#match-results"
                  hx-swap="innerHTML">
            View Current Matches
          </button>
        </div>
      </div>
      
      <div id="match-results"></div>
      
      <div class="form-group" id="notification-panel" style="display: none; margin-top: 20px;">
        <h3>Send Notifications</h3>
        <div class="notification-actions">
          <button class="btn btn-success" 
                  hx-post="http://main:3000/api/match/email-notification/:groupId" 
                  hx-target="#notification-results"
                  hx-swap="innerHTML">
            📧 Send Email Notifications
          </button>
          
          <button class="btn btn-info" 
                  hx-post="http://main:3000/api/match/notification/:groupId" 
                  hx-target="#notification-results"
                  hx-swap="innerHTML">
            📱 Send SMS Notifications
          </button>
        </div>
        
        <div class="api-endpoint-info" style="margin-top: 15px; padding: 10px; background-color: #f8f9fa; border-radius: 4px; border: 1px solid #ddd;">
          <strong>API Endpoints for this group:</strong>
          <div style="margin-top: 8px;">
            <div><code>POST /api/match/email-notification/<span id="email-endpoint-guid"></span></code></div>
            <div><code>POST /api/match/notification/<span id="sms-endpoint-guid"></span></code></div>
            <div><code>POST /api/match/<span id="match-endpoint-guid"></span></code></div>
          </div>
        </div>
      </div>
      
      <div id="notification-results"></div>
    </div>
  </div>
  
  <style>
    .guid-display {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
    }
    .guid-display code {
      font-family: monospace;
      font-size: 12px;
      color: #666;
      background-color: #f8f9fa;
      padding: 4px 8px;
      border-radius: 3px;
      border: 1px solid #ddd;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .notification-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .api-endpoint-info code {
      font-family: monospace;
      font-size: 11px;
      color: #495057;
      background-color: #e9ecef;
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
  
  <script>
    // This script will be loaded with the partial
    document.body.addEventListener('htmx:afterSwap', function(event) {
      // Show match actions when a group is selected
      if (event.detail.target.id === 'selected-group-info' && event.detail.target.innerHTML !== '') {
        document.getElementById('match-actions').style.display = 'block';
        
        // Extract group ID and update the buttons
        const groupId = document.getElementById('groupSelect').value;
        const matchButtons = document.querySelectorAll('#match-actions button');
        
        // Update current group ID display
        document.getElementById('current-group-id').textContent = groupId;
        
        // Update API endpoint displays
        document.getElementById('email-endpoint-guid').textContent = groupId;
        document.getElementById('sms-endpoint-guid').textContent = groupId;
        document.getElementById('match-endpoint-guid').textContent = groupId;
        
        matchButtons.forEach(button => {
          const hxAttr = button.getAttribute('hx-post') || button.getAttribute('hx-get');
          if (hxAttr && hxAttr.includes(':groupId')) {
            const newAttr = hxAttr.replace(':groupId', groupId);
            if (button.getAttribute('hx-post')) {
              button.setAttribute('hx-post', newAttr);
            } else {
              button.setAttribute('hx-get', newAttr);
            }
          }
        });
      }
      
      // Show notification panel when matches are displayed
      if (event.detail.target.id === 'match-results' && event.detail.target.innerHTML !== '') {
        document.getElementById('notification-panel').style.display = 'block';
        
        // Update notification buttons
        const groupId = document.getElementById('groupSelect').value;
        const notifyButtons = document.querySelectorAll('#notification-panel button');
        
        notifyButtons.forEach(button => {
          const hxAttr = button.getAttribute('hx-post');
          if (hxAttr && hxAttr.includes(':groupId')) {
            button.setAttribute('hx-post', hxAttr.replace(':groupId', groupId));
          }
        });
      }
    });
  </script>
