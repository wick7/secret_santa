<table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone Number</th>
        <th>Email</th>
        <th>Member ID</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- This content will be replaced by the API response -->
      {{#each members}}
      <tr>
        <td>
          <div class="member-info">
            <strong>{{firstName}} {{lastName}}</strong>
          </div>
        </td>
        <td>
          {{#if phoneNumber}}
            {{phoneNumber}}
          {{else}}
            <span class="text-muted">No phone</span>
          {{/if}}
        </td>
        <td>
          {{#if email}}
            {{email}}
          {{else}}
            <span class="text-muted">No email</span>
          {{/if}}
        </td>
        <td>
          <div class="guid-display">
            <code>{{_id}}</code>
            <button class="btn btn-sm btn-info" 
                    onclick="copyGuid('{{_id}}')" 
                    title="Copy Member ID">
              📋
            </button>
          </div>
        </td>
        <td>
          <div class="member-actions">
            <button class="btn btn-sm" 
                    hx-get="/partials/member-form?id={{_id}}" 
                    hx-target="#member-form-container"
                    hx-swap="innerHTML">Edit</button>
            <button class="btn btn-sm btn-danger" 
                    hx-delete="http://localhost:3001/api/members/{{_id}}" 
                    hx-confirm="Are you sure you want to delete this member?"
                    hx-target="#members-list"
                    hx-swap="innerHTML">Delete</button>
          </div>
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  
  <style>
    .guid-display {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .guid-display code {
      font-family: monospace;
      font-size: 11px;
      color: #666;
      background-color: #f8f9fa;
      padding: 2px 4px;
      border-radius: 3px;
      border: 1px solid #ddd;
    }
    .member-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .text-muted {
      color: #6c757d;
      font-style: italic;
    }
    .member-info {
      font-weight: 500;
    }
  </style>
